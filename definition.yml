#name: Travel Itinerary and Coordination Platform

#domainVisionStatement: >
#  To help traveller plan trips,connect with others , and manage their journeys easily in one place

terms:

  - name: Traveler
    definition: >
      A person who uses the platform to plan,customize,book and track the travel itineraries.
    aliases:
      - Customer
      - Tourist
    examples:
      - "The Traveler customized the itinerary by removing one destination."
      - "The Traveler joined a travel group to reduce overall trip cost."

  - name: Guide
    definition: >
      A person who helps travelers by guiding them during the trip.
    aliases:
      - Local Guide
      - Tour Guide
    examples:
      - "The guide helped travelers explore the destination"
      - "The guide confirmed availability before the trip"

  - name: Service Partner
    definition: >
      A provider that offers services needed for a trip
    aliases:
      - Partner
      - Vendor
      - Service Provider
    examples:
      - "The service partner provided accommodation for the trip."
      - "The service partner offered transport services"

  - name: Admin
    definition: >
      A person who manages and oversees the platform
    aliases:
      - System Administrator
    examples:
      - "The admin approved a user account."
      - "The admin monitored platform activity"

  - name: Itinerary
    definition: >
      A plan that outlines the details of the trip
    aliases:
      - Travel Plan
      - Trip Plan
    examples:
      - "the itinerary includes multiple destinations"
      - "the traveler updated the itinerary before the trip."

  - name: Travel Package
    definition: >
      A bundle of travel services offered together as a single option
    aliases:
      - Package
      - Tour Package
    examples:
      - "The traveler booked a travel package"
      - "The travel package included accommodation and transport"

  - name: Booking
    definition: >
      A confirmed reservation for a trip or travel service
    aliases:
      - Reservation
    examples:
      - "My booking was confirmed successfully."
      - "The traveler cancelled the booking before the trip"

  - name: Payment
    definition: >
      The act of paying for a trip or travel service.
    aliases:
      - Transaction
    examples:
      - "The payment was completed successfully"
      - "The payment status is pending."

  - name: Invoice
    definition: >
      A document that shows the details of charges of a trip or service.
    aliases:
      - Bill
      - Receipt
    examples:
      - "The traveler downloaded my invoice after payment."
      - "The invoice shows the total cost of the trip."

  - name: Travel Group
    definition: >
      A set of travellers who take a trip together
    aliases:
      - Group Trip
      - Travel Buddy Group
    examples:
      - "the traveller joined a travel group going to the same destination."
      - "the expenses were shared amoung the travel group"

  - name: Availability
    definition: >
      The state of being free or ready for booking.
    aliases:
      - Schedule
      - Status
    examples:
      - "The guide updated availability for the trip."
      - "The service was currently unavailable."

  - name: Trip Tracking
    definition: >
      The act of following the progress of a trip.
    aliases:
      - Journey Tracking
    examples:
      - "Trip tracking showed the current destination."
      - "The traveller checked the tip progress during the journey"

  - name: Notification
    definition: >
      A message sent to inform users about important updates.
    aliases:
      - Alert
      - SMS
    examples:
      - "the traveller received the alert about the booking"
      - "A Notification was sent for a payment update"
  
  - name: Destination
    definition: >
      A specific location where traveler wants to go or end the journey
    aliases: 
      - location
      - endpoint
      - stop
    examples:
      - "Charminar is the final destination of the trip"
      - "The hotel is hyderabad was a chosen destination"
    
  - name: Budget
    definition: >
      The amount of money available or planned to spend on a journey
    aliases:
      - Travel Budget
      - Spending limit
    examples:
      - "The traveler planned a low budget trip to reduce expenses"
      - "A high budget allowed staying in luxury hotels"

  - name: Rating and Review
    definition: >
      Feedback given by travelers about a service or experience
    aliases:
      - Feedback
      - user Review
    examples:
      - "The travelers gave a high rating to the guide"
      - "The review described the overall trip experience"

  - name: coupon
    definition: >
      A code or offer that provides a discount on a booking or service.
    aliases:
      - Discount code
      - promo code
    examples:
      - the traveler applied a coupon to reduce the booking cost
      - A coupon was used during payment
     
