<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Management - Xploreo</title>
    <meta name="description" content="Manage technical and non-technical administrators on the Xploreo platform." />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/module-crud.css" />
  </head>
  <body>
    <div id="navbar"></div>

    <div class="page-wrapper" id="main" style="display: none;">
      <!-- Rendered by adminManagement.js -->
    </div>

    <!-- Add / Edit Admin Modal -->
    <div id="admin-form-modal" class="modal-overlay">
      <div class="modal-content" style="width: 620px; height: auto; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header">
          <h2 id="admin-modal-title">Add Admin</h2>
          <span class="close-btn" id="admin-modal-close">&times;</span>
        </div>
        <div id="admin-modal-body" class="modal-body">
          <!-- Form rendered by adminManagement.js -->
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="admin-delete-modal" class="modal-overlay">
      <div class="modal-content" style="width: 440px; height: auto; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header">
          <h2>Confirm Delete</h2>
          <span class="close-btn" id="admin-delete-close">&times;</span>
        </div>
        <div class="modal-body">
          <p id="admin-delete-msg">Are you sure you want to delete this admin? This action cannot be undone.</p>
          <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button class="crud-btn" id="admin-delete-cancel">Cancel</button>
            <button class="crud-btn crud-danger" id="admin-delete-confirm" style="background: #dc2626; color: #fff;">Delete Admin</button>
          </div>
        </div>
      </div>
    </div>

    <!-- View Admin Modal -->
    <div id="admin-view-modal" class="modal-overlay">
      <div class="modal-content" style="width: 560px; height: auto; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header">
          <h2>Admin Details</h2>
          <span class="close-btn" id="admin-view-close">&times;</span>
        </div>
        <div id="admin-view-body" class="modal-body">
          <!-- Details rendered by adminManagement.js -->
        </div>
      </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="admin-reset-modal" class="modal-overlay">
      <div class="modal-content" style="width: 440px; height: auto; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header">
          <h2>Reset Password</h2>
          <span class="close-btn" id="admin-reset-close">&times;</span>
        </div>
        <div class="modal-body">
          <p id="admin-reset-desc" style="color:#4a5568; font-size:14px; margin-bottom:20px;"></p>
          <div class="am-form-error" id="am-reset-error"></div>
          <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:20px;">
            <label style="font-size:13px; font-weight:600; color:#374151;">New Password <span style="color:#dc2626">*</span></label>
            <input id="am-reset-password" type="password" placeholder="Min. 6 characters" autocomplete="new-password"
              style="padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; font-family:inherit; color:#111827; outline:none;" />
          </div>
          <div style="display: flex; gap: 12px; justify-content: flex-end;">
            <button class="crud-btn" id="admin-reset-cancel">Cancel</button>
            <button class="crud-btn crud-primary" id="admin-reset-confirm">Reset Password</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Status Confirmation Modal -->
    <div id="admin-status-modal" class="modal-overlay">
      <div class="modal-content" style="width: 440px; height: auto; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header">
          <h2 id="admin-status-modal-title">Confirm Status Change</h2>
          <span class="close-btn" id="admin-status-close">&times;</span>
        </div>
        <div class="modal-body">
          <p id="admin-status-msg">Are you sure you want to change this admin's status?</p>
          <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button class="crud-btn" id="admin-status-cancel">Cancel</button>
            <button class="crud-btn" id="admin-status-confirm">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
