<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body>
<div id="navbar"></div>

<div id="admin-dashboard" class="page-wrapper" style="display:none;">

    <!-- HEADER -->
    <div id="admin-header"></div>

    <!-- STATS -->
    <div id="admin-stats" class="stats-grid"></div>

    <!-- CHART -->
    <div id="admin-chart" class="content-card"></div>

    <!-- MID GRID -->
    <div class="split-grid">
        <div id="admin-partners" class="content-card"></div>

        <div class="side-column">
            <div id="admin-alerts" class="content-card"></div>
            <div id="admin-activity" class="content-card"></div>
        </div>
    </div>

    <!-- REGIONAL -->
    <div id="admin-regional" class="content-card"></div>

    <!-- USERS -->
    <div id="admin-users" class="content-card"></div>

    <!-- OPERATIONS -->
    <div id="admin-operations" class="content-card"></div>

    <!-- FINANCE -->
    <div id="admin-finance" class="content-card"></div>

    <!-- SYSTEM -->
    <div id="admin-system" class="content-card dark-card"></div>
</div>
<main id="main" class="page-wrapper">
    <div id="welcome-section" class="welcome"></div>

    <div id="stats-section" class="stats-grid"></div>

    <div id="tour-section" style="margin-top: 20px;"></div>

    <div id="earnings-section" class="content-card dash-section-spacing"></div>

    <div id="reviews-section" class="content-card dash-section-spacing"></div>
</main>

<script type="module" src="../js/app.js"></script>
    </body>
</html>
