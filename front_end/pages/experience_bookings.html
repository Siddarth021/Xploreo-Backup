<!DOCTYPE html>
<html>
<head>
  <title>Bookings</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/experiencestyles.css">
</head>

<body class="experience-page">

<!-- NAVBAR -->
<div id="navbar"></div>

<div class="page-container">

  <div class="page-header">
    <h1 class="page-title">Bookings</h1>
    <p class="page-subtitle">Manage all your experience bookings</p>
  </div>

  <!-- FILTER BAR -->
  <div class="content-card">
    <div class="filter-bar">
      <select>
        <option>All Experiences</option>
      </select>

      <select>
        <option>All Status</option>
      </select>
    </div>
  </div>

  <!-- BOOKINGS LIST -->
  <div id="bookingList"></div>

</div>

<!-- 🔥 MODAL -->
<div id="bookingModal" class="modal">
  <div class="modal-box">

    <div class="modal-header">
      <div>
        <h2 id="modalName"></h2>
        <div class="modal-sub">
          <span id="modalId"></span>
          <span id="modalStatus" class="status-badge"></span>
        </div>
      </div>

      <span class="close" onclick="closeModal()">✕</span>
    </div>

    <hr />

    <!-- EXPERIENCE -->
    <div class="section">
      <h3>Experience Details</h3>

      <p class="label">Experience</p>
      <p id="modalExperience"></p>

      <div class="grid-3">
        <div>
          <p class="label">Date</p>
          <p id="modalDate"></p>
        </div>

        <div>
          <p class="label">Time</p>
          <p id="modalTime"></p>
        </div>

        <div>
          <p class="label">Guests</p>
          <p id="modalGuests"></p>
        </div>
      </div>
    </div>

    <!-- CUSTOMER -->
    <div class="section">
      <h3>Customer Information</h3>

      <p class="label">Name</p>
      <p id="modalCustomer"></p>

      <div class="grid-2">
        <div>
          <p class="label">Phone</p>
          <p id="modalPhone"></p>
        </div>

        <div>
          <p class="label">Email</p>
          <p id="modalEmail"></p>
        </div>
      </div>
    </div>

    <!-- PAYMENT -->
    <div class="section">
      <h3>Payment</h3>

      <div class="payment-box">
        <div>
          <p class="label">Total Amount</p>
          <h2 id="modalAmount"></h2>
        </div>

        <span id="modalPaymentStatus" class="paid-badge"></span>
      </div>
    </div>

  </div>
</div>

<!-- NAVBAR SCRIPT -->
<script type="module">
  import { renderNavbar } from "../components/layout/navbar.js";

  renderNavbar({
    name: "Experience User",
    role: "experience"
  });
</script>

<!-- BOOKINGS SCRIPT -->
<script type="module" src="../js/modules/experience_bookings.js"></script>

</body>
</html>
