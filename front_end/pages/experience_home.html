<!DOCTYPE html>
<html>
<head>
    <title>Experience Home</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/experiencestyles.css">
</head>
<body class="experience-page">

<!-- NAVBAR -->


<div id="navbar"></div>

<div class="page-container">

    <!-- HEADER -->
     <div class="page-header">
        <h1 class="page-title">Home</h1>
        <p class="page-subtitle">Overview of your experience operations</p>
    </div>
    <!-- STATS -->
    <div class="stats-grid" id="stats"></div>

    <!-- ALERTS -->
    <div class="content-card">
        <div class="card-header">
            <h2>Action Required</h2>
        </div>
        <div id="alerts"></div>
    </div>

    <!-- SCHEDULE -->
    <div class="content-card">
        <div class="card-header">
            <h2>Today's Schedule</h2>
        </div>
        <div id="schedule"></div>
    </div>

    <!-- BOOKINGS -->
    <div class="content-card">
        <div class="card-header">
            <h2>Upcoming Bookings</h2>
        </div>
        <div id="bookings"></div>
    </div>

</div>
<section class="reviews-section">
  <h2 class="section-title">What People Say</h2>

  <div class="reviews-container" id="reviewsContainer">
    <!-- JS will fill this -->
  </div>
</section>

<script type="module" src="../js/modules/experience_home.js"></script>

</body>
</html>
