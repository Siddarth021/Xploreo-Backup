<!DOCTYPE html>
<html>
<head>
    <title>Hotel Dashboard</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/hotelstyle.css">
</head>
<body>

<div id="navbar"></div>

<main id="main" class="dashboard-wrapper">

    <div class="hotel-page-header">
        <h1>Home</h1>
        <p>Overview of your hotel performance</p>
    </div>

    <div id="hotel-stats" class="stats-grid"></div>

    <div id="rooms-section" class="hotel-content-card"></div>

    <div id="bookings-section" class="hotel-content-card"></div>

    <div class="hotel-split-grid">
        <div id="reviews-section" class="hotel-content-card"></div>
        <div id="activity-section" class="hotel-content-card"></div>
    </div>

</main>

<script type="module" src="../js/app.js"></script>

</body>
</html>
