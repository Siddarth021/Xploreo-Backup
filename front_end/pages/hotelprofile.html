<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Xploreo</title>
    <!-- Link CSS properly -->
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/hotelstyle.css">
</head>
<body class="hotel-bg-light">

    <!-- NAVBAR (Replicated from layout standard) -->
    <header id="hotel-profile-navbar" class="hotel-navbar-profile">
        <div class="nav-left">
            <div class="logo">
                <div class="logo-icon-wrap"><span class="logo-icon-text"></span></div>
                <span class="logo-text">Xploreo</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html">Home</a>
            <a href="hotelBookings.html">Bookings</a>
            <a href="hotelRooms.html">Services</a>
            <a href="hotelEarning.html">Earnings</a>
        </nav>
        <div class="nav-right">
            <span class="greeting">Hello, User <span class="wave">👋</span></span>
            <div class="user-avatar">U</div>
        </div>
    </header>

    <main id="main" class="dashboard-wrapper">
        <div class="hotel-page-header">
            <h1>Profile</h1>
            <p>Manage your hotel and account details</p>
        </div>

        <form id="profileForm" class="profile-layout">
            
            <!-- Profile Card -->
            <div class="hotel-content-card profile-card-top fade-in">
                <div class="profile-card-left">
                    <div class="profile-hotel-icon">
                        <i class="hotel-building-icon"></i>
                    </div>
                    <div class="profile-hotel-info">
                        <h2>Grand Plaza Hotel</h2>
                        <p class="location-text"><span class="loc-pin"></span> Downtown, New York City</p>
                    </div>
                </div>
                <button type="button" class="btn-blue edit-profile-btn">
                    <span class="edit-icon"></span>Edit Profile
                </button>
            </div>

            <!-- Hotel Details -->
            <div class="hotel-content-card section-card slide-up">
                <h3 class="section-title-large">Hotel Details</h3>
                <div class="profile-grid">
                    <div class="input-group">
                        <label>Hotel Name</label>
                        <input type="text" name="hotelName" class="profile-input" value="Grand Plaza Hotel">
                    </div>
                    <div class="input-group">
                        <label>Location</label>
                        <input type="text" name="location" class="profile-input" value="Downtown, New York City">
                    </div>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <label>Description</label>
                    <textarea name="description" class="profile-input textarea-tall"></textarea>
                </div>
                <div class="profile-grid" style="margin-top: 15px;">
                    <div class="input-group">
                        <label>Contact Number</label>
                        <div class="input-with-icon">
                            <span class="input-icon call-icon"></span>
                            <input type="tel" name="contactNumber" class="profile-input padded-left" value="+1 (212) 555-0123">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <div class="input-with-icon">
                            <span class="input-icon mail-icon"></span>
                            <input type="email" name="email" class="profile-input padded-left" value="info@grandplazahotel.com">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Business Information -->
            <div class="hotel-content-card section-card slide-up delay-1">
                <h3 class="section-title-large">Business Information</h3>
                <div class="profile-grid">
                    <div class="input-group">
                        <label>GST / Tax ID</label>
                        <input type="text" name="gst" class="profile-input" value="GST123456789">
                    </div>
                    <div class="input-group">
                        <label>Bank Account</label>
                        <div class="fake-input-wrapper">
                            <input type="text" name="bankAccount" class="profile-input disabled-like" value="*** *** *** 4582" readonly>
                            <a href="#" class="update-link">Update</a>
                        </div>
                    </div>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <label>Payout Method</label>
                    <input type="text" name="payoutMethod" class="profile-input" value="Wire Transfer">
                </div>
            </div>

            <!-- Policies Section -->
            <div class="hotel-content-card section-card slide-up delay-2">
                <h3 class="section-title-large">Policies</h3>
                <div class="profile-grid">
                    <div class="input-group">
                        <label>Check-in Time</label>
                        <input type="text" name="checkInTime" class="profile-input" value="14:00">
                    </div>
                    <div class="input-group">
                        <label>Check-out Time</label>
                        <input type="text" name="checkOutTime" class="profile-input" value="11:00">
                    </div>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <label>Cancellation Policy</label>
                    <input type="text" name="cancellationPolicy" class="profile-input" value="Free cancellation up to 48 hours before check-in">
                </div>
            </div>

            <!-- Save Action -->
            <div class="profile-actions slide-up delay-3">
                <button type="submit" id="saveProfileBtn" class="btn-blue btn-large"><span class="save-icon"></span> Save Changes</button>
            </div>
            
        </form>
    </main>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="hotel-modal hidden">
        <div class="hotel-modal-content edit-modal-override">
            <span class="hotel-modal-close" id="closeEditModalBtn">&times;</span>
            <h2 class="modal-title">Edit Profile</h2>

            <div class="modal-body-scroll">
                <!-- Logo Section -->
                <div class="logo-upload-section">
                    <div class="logo-placeholder">
                        <span class="hotel-building-icon large-icon">🏨</span>
                    </div>
                    <div class="logo-actions">
                        <button type="button" class="btn-blue btn-small">Upload Logo</button>
                        <p class="helper-text">Recommended: Square image, at least 400x400px</p>
                    </div>
                </div>

                <!-- Form Fields -->
                <div class="profile-grid">
                    <div class="input-group">
                        <label>Hotel Name</label>
                        <input type="text" id="modalHotelName" class="profile-input">
                    </div>
                    <div class="input-group">
                        <label>Location</label>
                        <input type="text" id="modalLocation" class="profile-input">
                    </div>
                </div>

                <div class="input-group" style="margin-top: 20px;">
                    <label>Description</label>
                    <textarea id="modalDescription" class="profile-input textarea-tall"></textarea>
                </div>

                <div class="profile-grid" style="margin-top: 20px;">
                    <div class="input-group">
                        <label>Contact Number</label>
                        <div class="input-with-icon">
                            <span class="input-icon call-icon">📞</span>
                            <input type="tel" id="modalContactNumber" class="profile-input padded-left">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <div class="input-with-icon">
                            <span class="input-icon mail-icon">✉️</span>
                            <input type="email" id="modalEmail" class="profile-input padded-left">
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="cancelEditModalBtn">Cancel</button>
                <button type="button" class="btn-blue" id="saveEditModalBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Import JS as module -->
    <script type="module" src="../js/modules/hotelprofile.js"></script>
</body>
</html>
