<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Logs & Issue Resolution - Technical Admin</title>
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/techadmin.css">
</head>
<body>
    <div id="navbar"></div>

    <div class="page-wrapper">
        <div class="tech-page-header">
            <h1>System Logs & Issue Resolution</h1>
            <p>Monitor system anomalies and resolve platform errors</p>
        </div>

        <div id="logs-list" class="tech-content-card">
            <div class="card-header">
                <h3>System Error Logs</h3>
                <div class="search-bar">
                    <input type="text" id="logs-search" placeholder="Search by Source or Message...">
                </div>
            </div>
            <table class="tech-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Type</th>
                        <th>Source</th>
                        <th>Message</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logs-tbody">
                    <!-- Logs will be rendered here -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
