<!DOCTYPE html>
<html>
    <head>
        <title>Tours</title>
        <link rel="stylesheet" href="../css/shared.css?v=cascade_v6">
        <link rel="stylesheet" href="../css/tours.css?v=cascade_v6">
    </head>
    <body data-page="tours">
        <div id="app">
            <!-- Navigation Sidebar -->
            <div id="navbar"></div>

            <!-- Main Content Area -->
            <main class="main-content">
                <!-- Header Section -->
                <header id="tour-page-header"></header>

                <!-- Internal Navbar (Tabs) -->
                <nav id="tours-internal-navbar"></nav>

                <!-- Content Area for Tours -->
                <div id="internal-contents"></div>
            </main>
        </div>

        <!-- Modal for Tour Details -->
        <div id="tourModal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="close-btn" onclick="closeModal()">&times;</span>
                </div>
                <div id="modalBody" class="modal-body">
                    </div>
                <div class="modal-footer">
                    <button class="secondary-btn" onclick="closeModal()">Close</button>
                </div>
            </div>
        </div>

        <script type="module" src="../js/app.js?v=final_fix_v5"></script>
    </body>
</html>
