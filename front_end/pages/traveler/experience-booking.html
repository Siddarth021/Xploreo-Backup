<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xploreo - Experience Traveler Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/traveler/traveller.css">
    <style>
        body { margin: 0; font-family: "Inter", sans-serif; background: linear-gradient(180deg, #eff4ff 0%, #f8fbff 100%); color: #10213a; }
        .traveler-experience-booking-page { width: min(1720px, calc(100% - 32px)); margin: 112px auto 48px; }
        .traveler-experience-booking-shell, .traveler-experience-booking-card, .traveler-experience-booking-summary { background: rgba(255,255,255,.96); border: 1px solid rgba(15,23,42,.08); box-shadow: 0 20px 48px rgba(15,23,42,.07); border-radius: 30px; }
        .traveler-experience-booking-shell { padding: 26px; }
        .traveler-experience-stepper { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 26px; }
        .traveler-experience-step { display: flex; align-items: center; gap: 12px; color: #64748b; font-weight: 700; }
        .traveler-experience-step span { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #e5e7eb; color: #64748b; }
        .traveler-experience-step.active { color: #2563eb; }
        .traveler-experience-step.active span { background: #2563eb; color: #fff; }
        .traveler-experience-step.done { color: #14b8a6; }
        .traveler-experience-step.done span { background: #14b8a6; color: #fff; }
        .traveler-experience-step-line { width: 80px; height: 3px; background: #e5e7eb; border-radius: 999px; }
        .traveler-experience-step-line.active { background: linear-gradient(135deg, #14b8a6 0%, #2563eb 100%); }
        .traveler-experience-booking-layout { display: grid; grid-template-columns: minmax(0, 1.9fr) 500px; gap: 28px; align-items: start; }
        .traveler-experience-booking-main { display: grid; gap: 26px; }
        .traveler-experience-booking-card { padding: 30px; }
        .traveler-experience-booking-card h2, .traveler-experience-booking-summary h2, .traveler-experience-booking-card h3, .traveler-experience-booking-summary h3 { margin: 0; font-family: "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-selected-card { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 18px; border-radius: 22px; background: #f7faff; margin: 18px 0 20px; }
        .traveler-experience-selected-icon { width: 56px; height: 56px; border-radius: 18px; background: #dff6f4; color: #14b8a6; display: inline-flex; align-items: center; justify-content: center; }
        .traveler-experience-selected-icon svg { width: 26px; height: 26px; }
        .traveler-experience-selected-card h3 { margin-bottom: 12px; font-size: 20px; }
        .traveler-experience-selected-card p { margin: 8px 0 0; color: #64748b; display: flex; align-items: center; gap: 8px; }
        .traveler-experience-selected-card p svg { width: 16px; height: 16px; }
        .traveler-experience-selected-rating { display: flex; gap: 10px; align-items: center; color: #64748b; margin-bottom: 10px; }
        .traveler-experience-selected-rating strong { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9px; background: #14b8a6; color: #fff; font-weight: 800; }
        .traveler-experience-selected-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .traveler-experience-selected-grid div { padding: 16px; border-radius: 18px; background: #f7faff; }
        .traveler-experience-selected-grid span, .traveler-experience-summary-group span { color: #64748b; display: block; margin-bottom: 8px; }
        .traveler-experience-selected-grid strong, .traveler-experience-summary-group strong { font-size: 17px; }
        .traveler-experience-selected-grid p, .traveler-experience-summary-group p { margin: 8px 0 0; color: #64748b; }
        .traveler-experience-change-link { display: inline-flex; margin-top: 18px; text-decoration: none; color: #2563eb; font-weight: 700; }
        .traveler-experience-booking-form { margin-top: 22px; }
        .traveler-experience-form-grid, .traveler-experience-traveler-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .traveler-experience-field { display: grid; gap: 10px; margin-bottom: 10px; }
        .traveler-experience-field span { font-weight: 700; color: #64748b; }
        .traveler-experience-input-wrap { display: flex; align-items: center; gap: 12px; padding: 16px 14px; border-radius: 16px; background: #f7faff; border: 1px solid #dbe4ef; }
        .traveler-experience-input-wrap svg { width: 20px; height: 20px; color: #64748b; }
        .traveler-experience-input-wrap input, .traveler-experience-field textarea, .traveler-experience-traveler-card input, .traveler-experience-traveler-card select { width: 100%; border: 0; outline: 0; background: transparent; font: inherit; color: #10213a; font-size: 17px; }
        .traveler-experience-field textarea, .traveler-experience-traveler-card input, .traveler-experience-traveler-card select { padding: 16px 14px; border-radius: 16px; background: #f7faff; border: 1px solid #dbe4ef; }
        .traveler-experience-field-note { margin: 0 0 18px; color: #64748b; font-size: 15px; }
        .traveler-experience-traveler-block { margin-top: 20px; }
        .traveler-experience-traveler-block h3 { margin-bottom: 16px; }
        .traveler-experience-traveler-card { padding: 20px; border-radius: 20px; border: 1px solid #dbe4ef; background: #f8fbff; }
        .traveler-experience-traveler-card h4 { margin: 0 0 16px; font: 700 18px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-traveler-card label { display: grid; gap: 8px; margin-bottom: 12px; }
        .traveler-experience-payment-info { display: flex; gap: 14px; align-items: flex-start; margin-top: 26px; padding: 20px; border-radius: 22px; background: #edf5ff; color: #2563eb; border: 1px solid #b7d3ff; }
        .traveler-experience-payment-info svg { width: 24px; height: 24px; flex-shrink: 0; }
        .traveler-experience-payment-info strong { display: block; color: #2563eb; margin-bottom: 8px; }
        .traveler-experience-payment-info p { margin: 0; color: #2563eb; }
        .traveler-experience-booking-summary { padding: 30px; position: sticky; top: 112px; }
        .traveler-experience-booking-summary h2 { margin-bottom: 20px; }
        .traveler-experience-booking-summary h3 { font-size: 20px; margin-bottom: 14px; }
        .traveler-experience-booking-summary p { color: #64748b; display: flex; align-items: center; gap: 8px; }
        .traveler-experience-booking-summary p svg { width: 16px; height: 16px; }
        .traveler-experience-summary-rating { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; color: #64748b; }
        .traveler-experience-summary-rating strong { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9px; background: #14b8a6; color: #fff; font-weight: 800; }
        .traveler-experience-summary-group { padding-top: 18px; margin-top: 18px; border-top: 1px solid #e2e8f0; }
        .traveler-experience-price-line, .traveler-experience-total-row { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
        .traveler-experience-price-line span { font-weight: 700; color: #243348; }
        .traveler-experience-total-row { margin-top: 22px; font: 800 24px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-total-row strong { color: #2563eb; font-size: 40px; }
        .traveler-experience-confirm-btn { width: 100%; margin-top: 22px; border: 0; border-radius: 18px; padding: 18px; background: linear-gradient(135deg, #14b8a6 0%, #2563eb 100%); color: #fff; font: inherit; font-weight: 800; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: 0 18px 34px rgba(37,99,235,.18); }
        .traveler-experience-confirm-btn svg { width: 20px; height: 20px; }
        .traveler-experience-summary-list { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 12px; color: #0f766e; }
        .traveler-experience-summary-list li { display: flex; gap: 10px; align-items: flex-start; }
        .traveler-experience-summary-list svg { width: 18px; height: 18px; flex-shrink: 0; }
        .traveler-experience-booking-empty { text-align: center; padding: 56px 28px; }
        .traveler-experience-booking-empty h1 { margin: 0 0 12px; font: 800 34px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-booking-empty p { margin: 0 0 20px; color: #64748b; }
        .traveler-experience-booking-empty a { display: inline-flex; padding: 14px 18px; border-radius: 16px; text-decoration: none; background: linear-gradient(135deg, #14b8a6 0%, #2563eb 100%); color: #fff; font-weight: 800; }
        .traveler-experience-toast { position: fixed; right: 24px; bottom: 24px; padding: 14px 18px; border-radius: 14px; background: #10213a; color: #fff; box-shadow: 0 18px 32px rgba(15,23,42,.22); opacity: 0; transform: translateY(12px); transition: opacity .18s ease, transform .18s ease; z-index: 2200; }
        .traveler-experience-toast.visible { opacity: 1; transform: translateY(0); }
        @media (max-width: 1200px) {
            .traveler-experience-booking-layout { grid-template-columns: 1fr; }
            .traveler-experience-booking-summary { position: static; top: auto; }
        }
        @media (max-width: 960px) {
            .traveler-experience-booking-page { width: min(100% - 20px, 1720px); margin-top: 96px; }
            .traveler-experience-stepper, .traveler-experience-selected-grid, .traveler-experience-form-grid, .traveler-experience-traveler-grid { grid-template-columns: 1fr; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div id="traveler-experience-booking-app"></div>
    <script type="module">
        import { renderTravelerNavbar } from "../../components/layout/navbar_traveler.js";
        renderTravelerNavbar();
    </script>
    <script type="module" src="../../js/traveler/experience-booking.js"></script>
</body>
</html>
