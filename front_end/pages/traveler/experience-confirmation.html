<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xploreo - Experience Confirmation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/traveler/traveller.css">
    <style>
        body { margin: 0; font-family: "Inter", sans-serif; background: linear-gradient(180deg, #eff4ff 0%, #f8fbff 100%); color: #10213a; }
        .traveler-experience-confirmation-page { width: min(1720px, calc(100% - 32px)); margin: 112px auto 48px; }
        .traveler-experience-confirmation-shell, .traveler-experience-side-panel { background: rgba(255,255,255,.96); border: 1px solid rgba(15,23,42,.08); box-shadow: 0 20px 48px rgba(15,23,42,.07); border-radius: 30px; }
        .traveler-experience-confirmed-hero { padding: 38px 28px; text-align: center; margin-bottom: 24px; }
        .traveler-experience-confirmed-icon { width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 18px; background: linear-gradient(135deg, #14b8a6 0%, #2563eb 100%); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
        .traveler-experience-confirmed-icon svg { width: 42px; height: 42px; }
        .traveler-experience-confirmed-hero h1 { margin: 0 0 12px; font: 800 44px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-confirmed-hero p { margin: 0; color: #64748b; font-size: 18px; }
        .traveler-experience-confirmed-meta { margin-top: 20px; display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; color: #64748b; }
        .traveler-experience-confirmed-meta strong { color: #10213a; }
        .traveler-experience-confirmation-layout { display: grid; grid-template-columns: minmax(0, 1.8fr) 420px; gap: 28px; }
        .traveler-experience-confirmation-main { display: grid; gap: 24px; }
        .traveler-experience-confirmation-card, .traveler-experience-side-panel { padding: 28px; }
        .traveler-experience-confirmation-card h2, .traveler-experience-confirmation-card h3, .traveler-experience-side-panel h3 { margin: 0; font-family: "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-confirmation-title { display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: center; margin-top: 18px; }
        .traveler-experience-confirmation-title img { width: 100%; height: 160px; object-fit: cover; border-radius: 22px; }
        .traveler-experience-confirmation-title p { margin: 10px 0 0; color: #64748b; display: flex; gap: 8px; align-items: center; }
        .traveler-experience-confirmation-title p svg { width: 16px; height: 16px; }
        .traveler-experience-confirmation-grid, .traveler-experience-traveler-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 22px; }
        .traveler-experience-confirmation-grid div, .traveler-experience-contact-card, .traveler-experience-traveler-card { padding: 18px; border-radius: 20px; background: #f7faff; border: 1px solid #dbe4ef; }
        .traveler-experience-confirmation-grid span { color: #64748b; display: block; margin-bottom: 8px; }
        .traveler-experience-confirmation-grid p, .traveler-experience-contact-card p, .traveler-experience-traveler-card p { margin: 10px 0 0; color: #64748b; }
        .traveler-experience-contact-card p svg { width: 16px; height: 16px; margin-right: 8px; vertical-align: middle; }
        .traveler-experience-side-panel ul { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 12px; color: #0f766e; }
        .traveler-experience-side-panel li { display: flex; gap: 10px; align-items: flex-start; }
        .traveler-experience-side-panel li svg { width: 18px; height: 18px; flex-shrink: 0; }
        .traveler-experience-primary-link, .traveler-experience-secondary-link { display: inline-flex; width: 100%; justify-content: center; align-items: center; border-radius: 18px; padding: 16px 18px; text-decoration: none; font-weight: 800; margin-top: 18px; }
        .traveler-experience-primary-link { background: linear-gradient(135deg, #14b8a6 0%, #2563eb 100%); color: #fff; }
        .traveler-experience-secondary-link { background: #eef2ff; color: #10213a; }
        .traveler-experience-confirmation-empty { text-align: center; padding: 56px 28px; }
        .traveler-experience-confirmation-empty h1 { margin: 0 0 12px; font: 800 34px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-confirmation-empty p { margin: 0 0 20px; color: #64748b; }
        .traveler-experience-confirmation-empty a { display: inline-flex; padding: 14px 18px; border-radius: 16px; text-decoration: none; background: linear-gradient(135deg, #14b8a6 0%, #2563eb 100%); color: #fff; font-weight: 800; }
        @media (max-width: 1200px) {
            .traveler-experience-confirmation-layout { grid-template-columns: 1fr; }
        }
        @media (max-width: 960px) {
            .traveler-experience-confirmation-page { width: min(100% - 20px, 1720px); margin-top: 96px; }
            .traveler-experience-confirmation-title, .traveler-experience-confirmation-grid, .traveler-experience-traveler-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="traveler-experience-confirmation-app"></div>
    <script type="module">
        import { renderTravelerNavbar } from "../../components/layout/navbar_traveler.js";
        renderTravelerNavbar();
    </script>
    <script type="module" src="../../js/traveler/experience-confirmation.js"></script>
</body>
</html>
