<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xploreo - Experience Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/traveler/traveller.css">
    <style>
        body { margin: 0; font-family: "Inter", sans-serif; background: linear-gradient(180deg, #eff4ff 0%, #f8fbff 100%); color: #10213a; }
        .traveler-experience-detail-page { width: min(1760px, calc(100% - 32px)); margin: 112px auto 48px; }
        .traveler-experience-detail-frame, .traveler-experience-detail-card, .traveler-experience-sidebar { background: rgba(255,255,255,.96); border: 1px solid rgba(15,23,42,.08); box-shadow: 0 20px 48px rgba(15,23,42,.07); border-radius: 30px; }
        .traveler-experience-detail-header { padding: 28px 30px; margin-bottom: 22px; }
        .traveler-experience-detail-top { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
        .traveler-experience-detail-header h1 { margin: 0 0 16px; font: 800 clamp(34px, 4vw, 52px) "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-meta { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; color: #64748b; font-size: 18px; }
        .traveler-experience-meta strong { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: #14b8a6; color: #fff; font-weight: 800; }
        .traveler-experience-meta svg { width: 18px; height: 18px; }
        .traveler-experience-pill-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
        .traveler-experience-pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 16px; line-height: 1; }
        .traveler-experience-pill svg { width: 18px; height: 18px; flex-shrink: 0; }
        .traveler-experience-pill-success { background: #dcfce7; color: #15803d; }
        .traveler-experience-pill-info { background: #dbeafe; color: #1d4ed8; }
        .traveler-experience-header-actions { display: flex; gap: 12px; }
        .traveler-experience-header-actions button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid #dbe4ef; background: #fff; color: #64748b; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .traveler-experience-header-actions svg { width: 24px; height: 24px; }
        .traveler-experience-detail-layout { display: grid; grid-template-columns: minmax(0, 2fr) 420px; gap: 28px; align-items: start; }
        .traveler-experience-gallery-block { display: grid; gap: 18px; }
        .traveler-experience-hero-media { position: relative; min-height: 360px; max-height: 520px; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 28px; }
        .traveler-experience-hero-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .traveler-experience-gallery-button { position: absolute; right: 22px; bottom: 22px; border: 0; border-radius: 16px; padding: 14px 18px; background: rgba(255,255,255,.96); color: #10213a; font: inherit; font-weight: 800; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
        .traveler-experience-gallery-button svg { width: 20px; height: 20px; }
        .traveler-experience-thumb-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
        .traveler-experience-thumb { border: 2px solid transparent; border-radius: 22px; padding: 0; overflow: hidden; cursor: pointer; background: #fff; }
        .traveler-experience-thumb.active { border-color: #14b8a6; box-shadow: 0 12px 30px rgba(20,184,166,.18); }
        .traveler-experience-thumb img { width: 100%; height: 150px; object-fit: cover; display: block; }
        .traveler-experience-tabs { display: flex; gap: 34px; padding: 0 26px; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; margin-top: 8px; background: rgba(255,255,255,.96); border-radius: 26px; }
        .traveler-experience-tab { border: 0; background: transparent; padding: 18px 0; color: #64748b; font: inherit; font-weight: 800; font-size: 18px; border-bottom: 3px solid transparent; cursor: pointer; }
        .traveler-experience-tab.active { color: #14b8a6; border-color: #14b8a6; }
        .traveler-experience-sections { margin-top: 22px; display: grid; gap: 24px; }
        .traveler-experience-detail-card { padding: 30px; }
        .traveler-experience-detail-card h2 { margin: 0 0 18px; font: 800 24px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-detail-card p { margin: 0 0 18px; color: #64748b; font-size: 17px; line-height: 1.7; }
        .traveler-experience-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
        .traveler-experience-list li { display: flex; gap: 10px; align-items: flex-start; color: #243348; font-size: 17px; }
        .traveler-experience-list svg { width: 18px; height: 18px; color: #14b8a6; flex-shrink: 0; margin-top: 4px; }
        .traveler-experience-highlight-grid, .traveler-experience-info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .traveler-experience-highlight-item, .traveler-experience-option-card, .traveler-experience-mini-card { border-radius: 22px; border: 1px solid #dbe4ef; background: #f8fbff; }
        .traveler-experience-highlight-item { display: flex; gap: 16px; padding: 20px; }
        .traveler-experience-highlight-item .icon { width: 52px; height: 52px; border-radius: 16px; background: #dff6f4; color: #14b8a6; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .traveler-experience-highlight-item .icon svg { width: 24px; height: 24px; }
        .traveler-experience-highlight-item h3, .traveler-experience-option-card h3 { margin: 0 0 8px; font: 700 18px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-highlight-item p, .traveler-experience-option-card p { margin: 0; font-size: 16px; }
        .traveler-experience-option-wrap { display: grid; gap: 18px; }
        .traveler-experience-option-card { position: relative; padding: 26px; cursor: pointer; }
        .traveler-experience-option-card.selected { border-color: #14b8a6; background: #f1fffd; box-shadow: 0 16px 34px rgba(20,184,166,.12); }
        .traveler-experience-option-badge { position: absolute; top: -14px; left: 18px; background: #14b8a6; color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 800; }
        .traveler-experience-option-top { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
        .traveler-experience-option-time { display: inline-flex; align-items: center; gap: 8px; color: #64748b; margin-top: 8px; }
        .traveler-experience-option-time svg { width: 16px; height: 16px; }
        .traveler-experience-option-price { text-align: right; color: #2563eb; font: 800 22px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-option-price span { display: block; color: #64748b; font: 500 15px "Inter", sans-serif; }
        .traveler-experience-feature-pills { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
        .traveler-experience-feature-pills span { padding: 8px 12px; border-radius: 10px; background: #e8fbf9; color: #0f766e; font-size: 14px; }
        .traveler-experience-info-grid { gap: 24px; }
        .traveler-experience-mini-card { padding: 24px; }
        .traveler-experience-mini-card ul { columns: 2; column-gap: 32px; margin: 0; padding-left: 22px; color: #64748b; }
        .traveler-experience-mini-card li { margin-bottom: 12px; }
        .traveler-experience-sidebar { padding: 28px; position: sticky; top: 112px; }
        .traveler-experience-sidebar h3 { margin: 0; font: 800 22px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-price { margin: 14px 0 8px; color: #2563eb; font: 800 52px "Plus Jakarta Sans", sans-serif; line-height: 1; }
        .traveler-experience-sidebar-note { color: #64748b; font-size: 16px; margin-bottom: 22px; }
        .traveler-experience-side-field { display: grid; gap: 10px; margin-top: 18px; }
        .traveler-experience-side-label { display: inline-flex; align-items: center; gap: 10px; color: #64748b; font-weight: 700; }
        .traveler-experience-side-label svg { width: 20px; height: 20px; }
        .traveler-experience-side-input { padding: 15px 16px; border-radius: 16px; border: 1px solid #dbe4ef; background: #f8fbff; font: inherit; font-size: 17px; color: #10213a; }
        .traveler-experience-side-stepper { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 14px; margin-top: 8px; }
        .traveler-experience-side-stepper button { width: 52px; height: 52px; border: 1px solid #dbe4ef; border-radius: 16px; background: #f8fbff; font-size: 28px; color: #243348; cursor: pointer; }
        .traveler-experience-side-stepper div { text-align: center; font: 800 18px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-selected-option { margin-top: 18px; padding: 18px 16px; border-radius: 18px; background: #f2fbfb; border: 1px solid #bfe9e4; }
        .traveler-experience-selected-option span { color: #64748b; display: block; margin-bottom: 8px; }
        .traveler-experience-selected-option strong { display: block; font-size: 18px; }
        .traveler-experience-selected-option p { margin: 6px 0 0; color: #64748b; font-size: 16px; }
        .traveler-experience-side-total-row { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 18px 0; border-top: 1px solid #e2e8f0; margin-top: 22px; color: #243348; font-size: 18px; }
        .traveler-experience-side-total { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 22px; font: 800 24px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-side-total strong { color: #2563eb; font-size: 42px; }
        .traveler-experience-continue-btn { width: 100%; border: 0; border-radius: 18px; padding: 18px; background: linear-gradient(90deg, #1DB7A6, #1E5EEA); color: #fff; font: inherit; font-weight: 800; font-size: 20px; cursor: pointer; box-shadow: 0 18px 34px rgba(30,94,234,.18); }
        .traveler-experience-side-list { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 12px; color: #0f766e; }
        .traveler-experience-side-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
        .traveler-experience-side-list svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
        .traveler-experience-empty { padding: 56px 28px; text-align: center; }
        .traveler-experience-empty h1 { margin: 0 0 12px; font: 800 34px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-empty p { margin: 0 0 20px; color: #64748b; }
        .traveler-experience-empty a { display: inline-flex; padding: 14px 18px; border-radius: 16px; text-decoration: none; background: linear-gradient(135deg, #14b8a6 0%, #2563eb 100%); color: #fff; font-weight: 800; }
        .traveler-experience-gallery-modal { position: fixed; inset: 0; background: rgba(15,23,42,.7); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 2000; }
        .traveler-experience-gallery-modal.open { display: flex; }
        .traveler-experience-gallery-modal-content { width: min(1100px, 100%); border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 28px 60px rgba(15,23,42,.3); }
        .traveler-experience-gallery-modal-top { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid #e2e8f0; }
        .traveler-experience-gallery-modal-top h3 { margin: 0; font: 800 22px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-gallery-close { border: 0; background: transparent; font-size: 34px; color: #64748b; cursor: pointer; }
        .traveler-experience-gallery-modal-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 18px; }
        .traveler-experience-gallery-modal-grid img { width: 100%; height: 240px; object-fit: cover; border-radius: 18px; }
        .traveler-experience-toast { position: fixed; right: 24px; bottom: 24px; padding: 14px 18px; border-radius: 14px; background: #10213a; color: #fff; box-shadow: 0 18px 32px rgba(15,23,42,.22); opacity: 0; transform: translateY(12px); transition: opacity .18s ease, transform .18s ease; z-index: 2200; }
        .traveler-experience-toast.visible { opacity: 1; transform: translateY(0); }
        @media (max-width: 1200px) {
            .traveler-experience-detail-layout { grid-template-columns: 1fr; }
            .traveler-experience-sidebar { position: static; top: auto; }
        }
        @media (max-width: 960px) {
            .traveler-experience-detail-page { width: min(100% - 20px, 1760px); margin-top: 96px; }
            .traveler-experience-detail-top, .traveler-experience-highlight-grid, .traveler-experience-info-grid, .traveler-experience-thumb-grid, .traveler-experience-gallery-modal-grid, .traveler-experience-mini-card ul { grid-template-columns: 1fr; columns: 1; }
            .traveler-experience-detail-top { flex-direction: column; }
            .traveler-experience-tabs { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div id="traveler-experience-detail-app"></div>
    <script type="module">
        import { renderTravelerNavbar } from "../../components/layout/navbar_traveler.js";
        renderTravelerNavbar();
    </script>
    <script type="module" src="../../js/traveler/experience-detail.js"></script>
</body>
</html>
