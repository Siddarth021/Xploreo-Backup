<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xploreo - Experience Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/traveler/traveller.css">
    <style>
        body { margin: 0; font-family: "Inter", sans-serif; background: linear-gradient(180deg, #eef4ff 0%, #f9fbff 100%); color: #10213a; }
        .traveler-experience-page { width: min(1760px, calc(100% - 32px)); margin: 112px auto 48px; }
        .traveler-experience-frame { background: rgba(255,255,255,.92); border: 1px solid rgba(15,23,42,.08); border-radius: 34px; box-shadow: 0 24px 60px rgba(15,23,42,.08); overflow: hidden; }
        .traveler-experience-toolbar { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.1fr) 194px; gap: 16px; padding: 22px 26px; border-bottom: 1px solid #dbe4ef; background: rgba(255,255,255,.92); }
        .traveler-experience-toolbar-field { display: grid; gap: 10px; padding: 16px 20px; border-radius: 18px; background: #f7faff; border: 1px solid #dbe4ef; }
        .traveler-experience-toolbar-label { font-size: 15px; font-weight: 700; color: #64748b; }
        .traveler-experience-toolbar-row { display: flex; align-items: center; gap: 12px; color: #64748b; }
        .traveler-experience-toolbar-row svg { width: 20px; height: 20px; flex-shrink: 0; }
        .traveler-experience-toolbar-input { width: 100%; border: 0; outline: 0; background: transparent; font: inherit; color: #10213a; font-size: 19px; }
        .traveler-experience-search-btn { border: 0; border-radius: 22px; background: linear-gradient(135deg, #14b8a6 0%, #2563eb 100%); color: #fff; font: inherit; font-weight: 800; font-size: 19px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: 0 18px 32px rgba(37,99,235,.18); }
        .traveler-experience-search-btn svg { width: 22px; height: 22px; }
        .traveler-experience-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 26px; padding: 28px 26px 34px; }
        .traveler-experience-filters, .traveler-experience-results-meta, .traveler-experience-card { background: rgba(255,255,255,.96); border: 1px solid rgba(15,23,42,.08); box-shadow: 0 18px 44px rgba(15,23,42,.06); }
        .traveler-experience-filters { border-radius: 28px; padding: 26px; align-self: start; position: sticky; top: 110px; }
        .traveler-experience-filters h2 { margin: 0 0 24px; font: 800 22px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-filter-group { padding: 0 0 28px; margin-bottom: 28px; border-bottom: 1px solid #e2e8f0; }
        .traveler-experience-filter-group-last { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
        .traveler-experience-filter-group h3 { margin: 0 0 18px; font-size: 17px; }
        .traveler-experience-slider-wrap input { width: 100%; accent-color: #2563eb; }
        .traveler-experience-slider-labels { display: flex; justify-content: space-between; margin-top: 12px; color: #64748b; font-weight: 700; }
        .traveler-experience-slider-labels .active { color: #2563eb; }
        .traveler-experience-check-list { display: grid; gap: 14px; }
        .traveler-experience-check { display: flex; align-items: center; gap: 12px; font-size: 16px; color: #243348; }
        .traveler-experience-check input { width: 22px; height: 22px; accent-color: #111827; }
        .traveler-experience-results { display: grid; gap: 22px; }
        .traveler-experience-results-meta { border-radius: 24px; padding: 22px 26px; font: 700 19px "Plus Jakarta Sans", sans-serif; }
        .traveler-experience-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; }
        .traveler-experience-card { overflow: hidden; border-radius: 24px; }
        .traveler-experience-card-media { position: relative; min-height: 250px; background-size: cover; background-position: center; }
        .traveler-experience-discount, .traveler-experience-tag { position: absolute; top: 16px; padding: 8px 14px; border-radius: 12px; font-size: 14px; font-weight: 800; }
        .traveler-experience-discount { left: 16px; color: #fff; background: #14b8a6; }
        .traveler-experience-tag { right: 16px; display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,.95); color: #243348; }
        .traveler-experience-tag svg { width: 16px; height: 16px; }
        .traveler-experience-fav { position: absolute; left: 18px; bottom: 18px; width: 48px; height: 48px; border: 0; border-radius: 50%; background: rgba(255,255,255,.98); color: #94a3b8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 12px 26px rgba(15,23,42,.15); }
        .traveler-experience-fav.active { color: #ef4444; }
        .traveler-experience-fav svg { width: 22px; height: 22px; }
        .traveler-experience-card-body { padding: 22px 22px 20px; }
        .traveler-experience-card-body h3 { margin: 0 0 10px; font: 700 22px "Plus Jakarta Sans", sans-serif; line-height: 1.3; }
        .traveler-experience-duration { margin: 0 0 14px; display: inline-flex; align-items: center; gap: 8px; color: #64748b; font-size: 15px; }
        .traveler-experience-duration svg { width: 16px; height: 16px; }
        .traveler-experience-perks { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 8px; color: #64748b; font-size: 15px; }
        .traveler-experience-perks li { display: flex; gap: 8px; align-items: center; }
        .traveler-experience-perks svg { width: 14px; height: 14px; color: #14b8a6; flex-shrink: 0; }
        .traveler-experience-rating { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .traveler-experience-rating span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9px; background: #14b8a6; color: #fff; font-weight: 800; }
        .traveler-experience-rating svg { width: 14px; height: 14px; }
        .traveler-experience-rating small { color: #64748b; font-size: 15px; }
        .traveler-experience-card-footer { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding-top: 18px; border-top: 1px solid #e2e8f0; }
        .traveler-experience-pricing small { display: block; color: #64748b; margin-bottom: 8px; }
        .traveler-experience-price-row { display: flex; align-items: baseline; gap: 10px; }
        .traveler-experience-price-row strong { font-size: 20px; }
        .traveler-experience-price-row span { color: #94a3b8; text-decoration: line-through; font-size: 14px; }
        .traveler-experience-view-btn { min-width: 128px; border: 0; border-radius: 16px; padding: 13px 18px; background: linear-gradient(135deg, #14b8a6 0%, #2563eb 100%); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
        .traveler-experience-empty { border-radius: 24px; padding: 44px 24px; background: rgba(255,255,255,.96); border: 1px solid rgba(15,23,42,.08); text-align: center; color: #64748b; font-size: 18px; }
        .traveler-experience-toast { position: fixed; right: 24px; bottom: 24px; padding: 14px 18px; border-radius: 14px; background: #10213a; color: #fff; box-shadow: 0 18px 32px rgba(15,23,42,.22); opacity: 0; transform: translateY(12px); transition: opacity .18s ease, transform .18s ease; z-index: 2000; }
        .traveler-experience-toast.visible { opacity: 1; transform: translateY(0); }
        @media (max-width: 1280px) {
            .traveler-experience-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 960px) {
            .traveler-experience-page { width: min(100% - 20px, 1760px); margin-top: 96px; }
            .traveler-experience-toolbar, .traveler-experience-layout, .traveler-experience-grid { grid-template-columns: 1fr; }
            .traveler-experience-filters { position: static; top: auto; }
        }
    </style>
</head>
<body>
    <div id="traveler-experience-search-app"></div>
    <script type="module">
        import { renderTravelerNavbar } from "../../components/layout/navbar_traveler.js";
        renderTravelerNavbar();
    </script>
    <script type="module" src="../../js/traveler/experience-search.js"></script>
</body>
</html>
